<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 Mpadrawy PS4 Host - مكتب البدراوي بطرة</title>
<style>
  body{background:#0a0e1a;color:white;font-family:system-ui,Tahoma;text-align:center;margin:0;padding:20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
  .title{font-size:42px;font-weight:900;color:#00d4ff;text-shadow:0 0 20px #00d4ff,0 0 40px #00d4ff;margin-bottom:5px}
  .sub{font-size:18px;color:#ccc;margin-bottom:25px}
  .box{background:#151c2f;border:1px solid #00d4ff33;border-radius:20px;padding:25px;max-width:450px;margin:0 auto;width:100%;box-shadow:0 0 30px rgba(0,212,255,0.15)}
  .fw{font-size:28px;font-weight:800;margin-bottom:20px;color:#fff}
  .btn{width:100%;padding:18px;border:none;border-radius:14px;font-size:20px;font-weight:900;cursor:pointer;margin-bottom:15px;transition:0.2s}
  .btn-gold{background:linear-gradient(90deg,#ffd600,#ff8c00);color:#000;box-shadow:0 4px 20px rgba(255,214,0,0.4)}
  .btn-gold:active{transform:scale(0.97)}
  .btn-blue{background:linear-gradient(90deg,#00d4ff,#0066ff);color:white}
  .status{margin-top:15px;font-size:14px;color:#888;min-height:50px;line-height:1.6}
  .link{margin-top:30px;font-size:13px;color:#666}
  .link b{color:#00d4ff}
</style>
</head>
<body>
  <div class="title">👑 Mpadrawy PS4 👑<br>Host</div>
  <div class="sub">مكتب البدراوي للبلايستيشن - بطرة</div>

  <div class="box">
    <div class="fw">PS4 - System 11.00</div>
    
    <button class="btn btn-gold" onclick="loadGoldHEN()">🚀 تشغيل GoldHEN الآن</button>
    <button class="btn btn-blue" onclick="loadGoldHEN()">تشغيل التعديلة 11.00</button>
    
    <div id="status" class="status">
      جاهز للتشغيل ✅<br>
      دوس على الزرار الأصفر
      <br><br>
      <span style="color:#ffd600">Host by Mpadrawy - 2026</span>
    </div>
  </div>

  <div class="link">
    لينكك الشخصي:<br>
    <b>https://mpadrawy.github.io</b><br>
    اكتبه في متصفح الـ PS4
  </div>

<script>
// هوست 11.00 شغال - بيستخدم Karo Host المستقر
function loadGoldHEN(){
  const s = document.getElementById('status');
  s.innerHTML = "⏳ جاري تحميل GoldHEN...<br>استنى 10 ثواني...";
  
  // ده لينك هوست شغال ومستقر لـ 11.00
  // هيحولك على هوست شغال 100% ويشغل التعديلة
  window.location.href = "https://karo218.ir/1100/index.html";
}

function loadHEN(){
  loadGoldHEN();
}

// لو عايز تشغيل اوتوماتيك من غير تحويل - كود احتياطي
// يمكنك تغييره لـ https://wolf2022.ir/1100/ او https://gamerhack.github.io
</script>
</body>
</html>
