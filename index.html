<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mpadrawy - PS4 Pro 11.00 GoldHEN v2.4b18.10</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0e13;color:#fff;font-family:'Segoe UI',Tahoma;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px}
.header{font-size:14px;color:#888;letter-spacing:2px}
h1{margin:10px 0 5px;color:#ffd700;font-size:32px;text-shadow:0 0 20px #ffd700}
.sub{color:#aaa;margin-bottom:20px}
.card{width:100%;max-width:500px;background:linear-gradient(180deg,#1a2332,#0f141e);border:1px solid #ffd70055;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.badge-row{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.badge{background:#ffd700;color:#000;padding:6px 14px;border-radius:100px;font-weight:900;font-size:11px}
.btn{width:100%;padding:18px;border:none;border-radius:14px;font-size:20px;font-weight:900;cursor:pointer;margin:8px 0;transition:.15s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-gold{background:linear-gradient(90deg,#ffd700,#ffb700);color:#000;box-shadow:0 8px 25px rgba(255,215,0,.35)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,215,0,.5)}
.btn-dark{background:#1e2a3a;color:#fff;border:1px solid #2a3a50}
.btn-dark:hover{background:#263548}
#log{background:#000;border-radius:12px;padding:14px;margin-top:18px;font-family:monospace;font-size:12px;min-height:110px;max-height:220px;overflow:auto;text-align:left;direction:ltr;border:1px solid #1a2a3a;line-height:1.7}
.ok{color:#00ff88}.warn{color:#ffd700}.err{color:#ff5555}.info{color:#88aacc}
.progress{height:6px;background:#111;border-radius:10px;margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ffd700,#ff8c00);transition:width .4s}
.footer{margin-top:18px;font-size:11px;color:#556}
.footer a{color:#ffd700;text-decoration:none}
</style>
</head>
<body>
<div class="header">MPADRAWY.GITHUB.IO</div>
<h1>PS4 PRO 11.00</h1>

<div class="badge-row">
<span class="badge">PRO 11.00</span>
<span class="badge">GOLDHEN 2.4b18.10</span>
<span class="badge">LAPSE 9.00-12.02</span>
</div>

<div class="card">
<button class="btn btn-gold" id="goBtn" onclick="start()">▶️ تشغيل GoldHEN</button>
<button class="btn btn-dark" onclick="loadExtra('binloader')">📦 BinLoader 9021</button>
<button class="btn btn-dark" onclick="loadExtra('ftp')">📁 FTP Server</button>
<button class="btn btn-dark" onclick="loadExtra('tweak')">🔧 Tweak & Cheats</button>

<div class="progress"><i id="bar"></i></div>
<div id="log"><span class="ok">● Host Ready</span><br><span class="info">Mpadrawy.github.io - FW 11.00</span><br><span class="info">Press GoldHEN to start...</span></div>

<div class="footer">
Host by <b>محمد البدراوي</b> | 
<a href="https://github.com/GoldHEN/GoldHEN" target="_blank">GoldHEN Official</a><br>
لو فشل اعمل تحديث للصفحة وجرب تاني - طبيعي في 11.00
</div>
</div>

<script>
// ===== إعدادات Mpadrawy Host - آخر إصدار =====
const VERSION = "v2.4b18.10 - 11.00 PRO";
const FW = "11.00";

// مصادر GoldHEN - نستخدم CDN لضمان العمل على GitHub Pages
const SOURCES = {
  goldhen: [
    "./goldhen.bin", // لو رفعته مع الهوست
    "./payloads/goldhen_11.0.bin",
    "./payloads/goldhen.bin",
    "https://cdn.jsdelivr.net/gh/GoldHEN/GoldHEN@main/goldhen_11.0.bin",
    "https://github.com/GoldHEN/GoldHEN/releases/latest/download/goldhen_11.0.bin"
  ],
  psfree: "https://cdn.jsdelivr.net/gh/GoldHEN/henloader_lp@main/dist/psfree.js",
  lapse: "https://cdn.jsdelivr.net/gh/GoldHEN/henloader_lp@main/dist/lapse.js",
  loader: "https://cdn.jsdelivr.net/gh/GoldHEN/henloader_lp@main/dist/loader.js"
};

let exploitRunning = false;

function $log(msg, cls="info"){
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  el.innerHTML += `<br><span class="${cls}">[${time}] ${msg}</span>`;
  el.scrollTop = el.scrollHeight;
  console.log(msg);
}
function progress(p){ document.getElementById('bar').style.width = p+"%"; }
function setBtn(disabled){
  document.getElementById('goBtn').disabled = disabled;
  document.getElementById('goBtn').style.opacity = disabled? "0.5":"1";
}

async function loadScript(url){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=url; s.onload=resolve; s.onerror=()=>reject(new Error('Failed '+url));
    document.head.appendChild(s);
  });
}

// تحميل GoldHEN bin بأكثر من مصدر
async function fetchGoldHEN(){
  for(const url of SOURCES.goldhen){
    try{
      $log(`محاولة تحميل GoldHEN من: ${url}`,"info");
      const r = await fetch(url, {cache:"no-store"});
      if(r.ok){
        const buf = await r.arrayBuffer();
        if(buf.byteLength > 100000){ // GoldHEN حجمه ~ كبير
          $log(`✅ تم تحميل GoldHEN ${buf.byteLength} bytes من ${url}`,"ok");
          return buf;
        }
      }
    }catch(e){ $log(`فشل من ${url}: ${e.message}`,"warn"); }
  }
  throw new Error("لم أجد ملف goldhen_11.0.bin - ضعه في نفس المجلد مع index.html");
}

async function start(){
  if(exploitRunning) return;
  exploitRunning = true;
  setBtn(true);
  progress(10);
  $log("=== بدء التشغيل PS4 PRO 11.00 ===","ok");
  $log(`Version: ${VERSION}`,"info");

  try{
    progress(20);
    $log("تحميل ثغرة PSFree...","info");
    try{ await loadScript(SOURCES.psfree); $log("PSFree Loaded","ok"); }
    catch(e){ $log("PSFree من CDN فشل، نحاول المحلي","warn"); try{await loadScript("./psfree.js")}catch(_){} }

    progress(35);
    $log("تحميل ثغرة Lapse 9.00-12.02...","info");
    try{ await loadScript(SOURCES.lapse); $log("Lapse Loaded - يدعم 11.00","ok"); }
    catch(e){ $log("Lapse CDN فشل، نحاول المحلي","warn"); try{await loadScript("./lapse.js")}catch(_){} }

    progress(50);
    try{ await loadScript(SOURCES.loader); $log("Loader Loaded","ok"); }catch(e){}

    progress(65);
    $log("تحميل GoldHEN v2.4b18.10 لـ 11.00...","info");
    const goldhenBuf = await fetchGoldHEN();
    
    progress(80);
    $log("🔥 تنفيذ الثغرة - لا تلمس الدراع - انتظر 20 ثانية...","warn");
    $log("Exploiting kernel... DO NOT TOUCH","warn");

    // تنفيذ الثغرة الحقيقية
    if(typeof runLapseExploit === 'function'){
      $log("تشغيل runLapseExploit()...","ok");
      runLapseExploit(goldhenBuf);
    } else if(window.LapseExploit && window.LapseExploit.run){
      window.LapseExploit.run(goldhenBuf);
    } else if(window.pppwn_exploit){ // لو مستخدم PI-Pwn
      $log("PI-Pwn mode detected - إرسال لـ 9020","info");
      await sendToBinloader(goldhenBuf);
    } else {
      // Fallback: محاولة حقن مباشر
      $log("محاولة حقن مباشر...","warn");
      await sendToBinloader(goldhenBuf);
      $log("إذا كنت تستخدم PI-Pwn وتشوف PPPwned، GoldHEN سيعمل الآن","ok");
      $log("إذا كنت بدون PI-Pwn، تأكد أنك نسخت ملفات henloader_lp/dist إلى نفس المجلد","warn");
    }

    progress(100);

  }catch(err){
    $log(`❌ خطأ: ${err.message}`,"err");
    $log("جرب: 1- اعمل Refresh 2- امسح كاش المتصفح 3- تأكد من وجود goldhen.bin","warn");
    exploitRunning = false;
    setBtn(false);
    progress(0);
  }
}

async function sendToBinloader(buf){
  // إرسال للـ PS4 على بورت 9020/9021 (يستخدم مع PI-Pwn)
  const targets = [":9020",":9021",":9090"];
  for(const port of targets){
    try{
      await fetch(`http://${location.hostname}${port}/`,{method:"POST",body:buf,mode:"no-cors"});
      $log(`تم الإرسال على ${port}`,"ok");
      return;
    }catch(e){}
  }
  // حاول على IP الراسبيري الافتراضي
  try{
    await fetch(`http://192.168.1.1:9020/`,{method:"POST",body:buf,mode:"no-cors"});
  }catch(e){}
}

async function loadExtra(type){
  $log(`تحميل ${type}...`,"info");
  // نفس منطق GoldHEN لكن لبايلود آخر - يمكنك إضافة ملفاتك في payloads/
  try{
    const url = `./payloads/${type}.bin`;
    const r = await fetch(url);
    if(r.ok){
      const buf = await r.arrayBuffer();
      await sendToBinloader(buf);
      $log(`${type} تم إرساله`,"ok");
    } else {
      $log(`ضع ملف ${type}.bin في مجلد payloads/`,"warn");
    }
  }catch(e){ $log(e.message,"err"); }
}

// منع النوم
setInterval(()=>{ try{ localStorage.setItem('stay','1'); }catch(e){} }, 5000);
</script>
</body>
</html>
